<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>LMRP Report Viewer</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #e9e9e9;

    }


    body {

      overflow: hidden;

    }


    /* --------------------------------
       TOP TOOLBAR
    -------------------------------- */

    #toolbar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 58px;

      background: #c9489a;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      padding: 0 16px;

      z-index: 1000;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.18);

    }


    /* --------------------------------
       BUTTONS
    -------------------------------- */

    .control {

      border: 1px solid
        rgba(255,255,255,0.55);

      background:
        rgba(255,255,255,0.18);

      color: white;

      border-radius: 7px;

      padding:
        8px 13px;

      font-size: 14px;

      cursor: pointer;

      backdrop-filter:
        blur(5px);

      transition:
        background 0.15s ease;

    }


    .control:hover {

      background:
        rgba(255,255,255,0.30);

    }


    .control:active {

      background:
        rgba(255,255,255,0.40);

    }


    #pageInfo {

      color: white;

      font-size: 14px;

      font-weight: 500;

      min-width: 110px;

      text-align: center;

    }


    /* --------------------------------
       MAIN SCROLLING AREA
    -------------------------------- */

    #viewer {

      position: fixed;

      top: 58px;

      bottom: 0;

      left: 0;

      right: 0;

      overflow-y: scroll;

      overflow-x: auto;

      padding:

        28px
        20px
        60px
        20px;

      background: #e9e9e9;

      text-align: center;

    }


    /* --------------------------------
       PDF PAGE CONTAINER
    -------------------------------- */

    .page {

      display: block;

      margin:

        0
        auto
        24px
        auto;

      background: white;

      box-shadow:
        0 2px 12px
        rgba(0,0,0,0.18);

    }


    /* --------------------------------
       CANVAS
    -------------------------------- */

    canvas {

      display: block;

      margin: 0 auto;

    }


    /* --------------------------------
       LOADING MESSAGE
    -------------------------------- */

    #loading {

      color: #555;

      font-size: 17px;

      padding-top: 60px;

    }


    /* --------------------------------
       SCROLLBAR
    -------------------------------- */

    #viewer::-webkit-scrollbar {

      width: 12px;

    }


    #viewer::-webkit-scrollbar-track {

      background: #d8d8d8;

    }


    #viewer::-webkit-scrollbar-thumb {

      background: #999;

      border-radius: 8px;

      border: 3px solid #d8d8d8;

    }


    #viewer::-webkit-scrollbar-thumb:hover {

      background: #777;

    }


  </style>

</head>


<body>


  <!-- ==============================
       TOOLBAR
  =============================== -->

  <div id="toolbar">


    <button
      class="control"
      id="previous">

      Previous

    </button>


    <span id="pageInfo">

      Loading...

    </span>


    <button
      class="control"
      id="next">

      Next

    </button>


    <button
      class="control"
      id="zoomOut">

      −

    </button>


    <button
      class="control"
      id="zoomIn">

      +

    </button>


  </div>



  <!-- ==============================
       PDF VIEWER
  =============================== -->

  <div id="viewer">

    <div id="loading">

      Loading report...

    </div>

  </div>



  <!-- ==============================
       PDF.JS
  =============================== -->

  <script type="module">


    import * as pdfjsLib from

      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =

      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";



    /* --------------------------------
       MASTER PDF
    -------------------------------- */

    const PDF_URL =

      "https://tep-thames.maps.arcgis.com/sharing/rest/content/items/ea21c731645442e4b1e33a7d1b920166/data";



    /* --------------------------------
       VARIABLES
    -------------------------------- */

    let pdf = null;

    let scale = 1;

    let pages = [];



    /* --------------------------------
       STARTING PAGE

       ?page=127
    -------------------------------- */

    const params =

      new URLSearchParams(
        window.location.search
      );


    const requestedPage =

      parseInt(
        params.get("page")
      );



    /* --------------------------------
       LOAD PDF
    -------------------------------- */

    async function loadPDF() {

      try {


        pdf = await

          pdfjsLib.getDocument({

            url: PDF_URL

          }).promise;



        document.getElementById(
          "loading"
        ).remove();



        /*
          Render all pages
        */

        await renderAllPages();



        /*
          If a page was supplied in the URL,
          scroll to that page.
        */

        if (

          !isNaN(requestedPage) &&

          requestedPage >= 1 &&

          requestedPage <= pdf.numPages

        ) {

          setTimeout(() => {

            scrollToPage(
              requestedPage
            );

          }, 100);

        }


      }

      catch (error) {

        console.error(error);


        document.getElementById(
          "loading"
        ).textContent =

          "Unable to load the report.";

      }

    }



    /* --------------------------------
       RENDER ALL PAGES
    -------------------------------- */

    async function renderAllPages() {


      const viewer =

        document.getElementById(
          "viewer"
        );


      for (

        let pageNumber = 1;

        pageNumber <= pdf.numPages;

        pageNumber++

      ) {


        const page =

          await pdf.getPage(
            pageNumber
          );


        const viewport =

          page.getViewport({

            scale: scale

          });



        /*
          Create page wrapper
        */

        const pageContainer =

          document.createElement(
            "div"
          );


        pageContainer.className =
          "page";


        pageContainer.dataset.page =
          pageNumber;



        /*
          Create canvas
        */

        const canvas =

          document.createElement(
            "canvas"
          );


        canvas.width =
          viewport.width;

        canvas.height =
          viewport.height;



        pageContainer.appendChild(
          canvas
        );


        viewer.appendChild(
          pageContainer
        );



        const context =
          canvas.getContext("2d");


        await page.render({

          canvasContext:
            context,

          viewport:
            viewport

        }).promise;


        pages.push({

          number:
            pageNumber,

          container:
            pageContainer

        });

      }


      updatePageIndicator();

    }



    /* --------------------------------
       SCROLL TO PAGE
    -------------------------------- */

    function scrollToPage(
      pageNumber
    ) {


      const target =

        pages.find(
          p =>
            p.number === pageNumber
        );


      if (!target) return;


      target.container.scrollIntoView({

        behavior: "smooth",

        block: "start"

      });

    }



    /* --------------------------------
       PAGE INDICATOR
    -------------------------------- */

    function updatePageIndicator() {


      const viewer =

        document.getElementById(
          "viewer"
        );


      const viewerTop =
        viewer.scrollTop;


      let current = 1;


      for (
        const page of pages
      ) {


        if (

          page.container.offsetTop
          <=
          viewerTop + 150

        ) {

          current =
            page.number;

        }

      }


      document.getElementById(
        "pageInfo"
      ).textContent =

        "Page " +

        current +

        " of " +

        pdf.numPages;

    }



    /* --------------------------------
       SCROLL EVENT
    -------------------------------- */

    document
      .getElementById("viewer")
      .addEventListener(
        "scroll",
        updatePageIndicator
      );



    /* --------------------------------
       NEXT
    -------------------------------- */

    document
      .getElementById("next")
      .addEventListener(
        "click",
        function() {


          const currentText =

            document.getElementById(
              "pageInfo"
            ).textContent;


          const match =
            currentText.match(/\d+/);


          const current =

            match
              ? parseInt(match[0])
              : 1;


          if (
            current < pdf.numPages
          ) {

            scrollToPage(
              current + 1
            );

          }

        }
      );



    /* --------------------------------
       PREVIOUS
    -------------------------------- */

    document
      .getElementById("previous")
      .addEventListener(
        "click",
        function() {


          const currentText =

            document.getElementById(
              "pageInfo"
            ).textContent;


          const match =
            currentText.match(/\d+/);


          const current =

            match
              ? parseInt(match[0])
              : 1;


          if (current > 1) {

            scrollToPage(
              current - 1
            );

          }

        }
      );



    /* --------------------------------
       ZOOM IN
    -------------------------------- */

    document
      .getElementById("zoomIn")
      .addEventListener(
        "click",
        async function() {


          scale += 0.2;


          await rerender();

        }
      );



    /* --------------------------------
       ZOOM OUT
    -------------------------------- */

    document
      .getElementById("zoomOut")
      .addEventListener(
        "click",
        async function() {


          if (scale <= 0.6) {
            return;
          }


          scale -= 0.2;


          await rerender();

        }
      );



    /* --------------------------------
       RERENDER AFTER ZOOM
    -------------------------------- */

    async function rerender() {


      const viewer =

        document.getElementById(
          "viewer"
        );


      /*
        Remember current page
      */

      const currentText =

        document.getElementById(
          "pageInfo"
        ).textContent;


      const match =
        currentText.match(/\d+/);


      const currentPage =

        match
          ? parseInt(match[0])
          : 1;


      /*
        Remove existing pages
      */

      viewer
        .querySelectorAll(".page")
        .forEach(
          element =>
            element.remove()
        );


      pages = [];


      /*
        Render again
      */

      await renderAllPages();


      /*
        Return to the page we were on
      */

      setTimeout(() => {

        scrollToPage(
          currentPage
        );

      }, 50);

    }



    /* --------------------------------
       START
    -------------------------------- */

    loadPDF();


  </script>


</body>

</html>
